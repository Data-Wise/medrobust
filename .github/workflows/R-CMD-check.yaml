# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 8 * * 1'

name: R-CMD-check

permissions: read-all

# One run per workflow+ref: a newer push to dev or a PR branch cancels the
# superseded run instead of queueing a full 3-OS matrix per commit.
# main (and the weekly schedule, which runs on main) is never cancelled, so
# every commit that reaches main keeps a complete check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        env:
          # The r-lib actions set NOT_CRAN=true, which runs the 22 skip_on_cran()
          # simulation tests (~80% of test time: ~23 min on ubuntu, ~30 on
          # windows). Pull requests skip them; pushes to main/dev and the weekly
          # schedule run the full suite, so every commit that lands is still
          # fully checked.
          NOT_CRAN: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
        with:
          upload-snapshots: true
          args: >
            ${{ runner.os == 'Windows' && 'c("--no-manual", "--ignore-vignettes")' || 'c("--no-manual", "--as-cran")' }}
          build_args: >
            ${{ runner.os == 'Windows' && 'c("--no-manual", "--no-build-vignettes")' || 'c("--no-manual")' }}
