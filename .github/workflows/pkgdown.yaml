# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Standardized workflow for mediationverse ecosystem packages
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::quarto, local::.
          needs: website

      - name: Hide agent-instruction docs from pkgdown
        # pkgdown::package_mds() has no config-level exclude list — it hardcodes
        # README/LICENSE/LICENCE/NEWS/cran-comments as the only skipped root .md
        # files and renders every other root .md (e.g. CLAUDE.md) as a public
        # page (HTML, plus an llms.txt-era markdown twin, a sitemap.xml entry,
        # and a full-text search.json entry). A POST-build `rm docs/CLAUDE.*`
        # only removes the .html — it misses those companion artifacts, which
        # still leak the content. CLAUDE.md must stay at the repo root for
        # Claude Code discovery, so remove it from this disposable CI checkout
        # BEFORE the build runs instead, so package_mds() never sees it.
        run: rm -f CLAUDE.md

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
