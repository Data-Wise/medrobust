# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Standardized workflow for mediationverse ecosystem packages
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::quarto, local::.
          needs: website

      - name: Hide non-site root docs from pkgdown
        # pkgdown::package_mds() has no config-level exclude list: it publishes
        # every root .md except README/LICENSE/NEWS/cran-comments as a public
        # page (HTML, plus a markdown twin, a sitemap.xml entry and a full-text
        # search.json entry). A POST-build rm of docs/<file>.html misses those
        # companions, so delete the sources from this disposable CI checkout
        # BEFORE the build. Allowlist, not a name list: agent files (CLAUDE.md,
        # AGENTS.md) and planning docs (SPEC-*, PLAN-*, ...) must never reach the
        # site, and a new prefix must not leak just because no one listed it.
        run: |
          find . -maxdepth 1 -type f -name '*.md' \
            ! -name README.md ! -name NEWS.md ! -name LICENSE.md ! -name cran-comments.md \
            -print -delete

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          # Mirror the build exactly: remove pages whose source is gone (deleted
          # help topics, renamed articles). Safe only with development mode
          # `release` in _pkgdown.yml; mode auto would build dev versions into
          # docs/dev/ alone and this would wipe the released site at the root.
          clean: true
          branch: gh-pages
          folder: docs
